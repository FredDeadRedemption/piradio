<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>webradio</title>
<link rel="icon" href="/listen/icon-192.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <header>
    <h1 id="station">webradio</h1>
    <div class="now">
      <span id="dot" class="dot"></span>
      <span id="title">&mdash;</span>
      <span id="listeners" class="muted"></span>
    </div>
    <div class="row">
      <audio id="player" controls preload="none"></audio>
      <button id="skip" class="ghost">skip</button>
      <button id="copy" class="ghost">copy stream url</button>
    </div>
  </header>

  <section>
    <h2>mode</h2>
    <div class="modes">
      <button class="mode" data-mode="random"><strong>random</strong><span>shuffle everything in /random</span></button>
      <button class="mode" data-mode="segments"><strong>segments</strong><span>shuffle spoken-word clips</span></button>
      <button class="mode" data-mode="channel"><strong>channel</strong><span>play one playlist in order</span></button>
    </div>
    <div class="row">
      <select id="channel"></select>
      <label class="check"><input type="checkbox" id="shuffle"> shuffle channel</label>
      <button id="newChannel" class="ghost">new channel</button>
      <button id="delChannel" class="ghost danger">delete channel</button>
    </div>
  </section>

  <section>
    <h2>schedule</h2>
    <div class="row">
      <label class="check"><input type="checkbox" id="scheduled"> follow schedule</label>
      <span id="next" class="muted"></span>
    </div>
    <div id="slots" class="slots"></div>
    <button id="addSlot" class="ghost">add slot</button>
  </section>

  <section>
    <h2>library</h2>
    <div class="tabs" id="tabs"></div>
    <label id="drop" class="drop">
      <input type="file" id="file" accept="audio/*" multiple hidden>
      <span id="dropText">drop audio here, or click to pick</span>
    </label>
    <ul id="tracks" class="tracks"></ul>
  </section>

  <p class="foot"><a id="public" target="_blank" rel="noopener" hidden></a></p>

  <p id="toast" class="toast"></p>
</main>
<script src="/app.js"></script>
</body>
</html>
