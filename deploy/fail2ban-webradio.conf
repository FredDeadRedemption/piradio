# basic auth is enforced by the api, so failures surface as 401s in nginx's access log
# rather than in error.log where the stock nginx-http-auth filter looks.
# fail2ban strips the timestamp before matching, so the pattern must not expect it.
[Definition]
failregex = ^<HOST> .*"(?:GET|POST|PUT|DELETE|HEAD|PATCH|OPTIONS) [^"]*" 401\s
ignoreregex =
